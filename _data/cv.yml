        highlights:
          - Worked on research projects collaboratively with Swinburne University and CGI Space to automate and enhance capabilities of the observatory at RMIT.
          - Maintained, calibrated, and troubleshoot the RMIT Robotic Observatory including writing MATLAB and Python codes to control COM objects. 
          - Performed project demonstrations for CGI, UK and Defence Science and Technology Group as part of a multi-disciplinary team working in high pressure environment with synthetic and real scenarios.

      - company: RMIT University
        position: Doctoral Researcher
        location: Melbourne, Australia
        start_date: 2019
        end_date: 2023
        highlights:
          - Advanced the science of extrusion-based additive manufacturing of high-performance polymer composites by designing and executing process studies across compression molding, injection molding, and FDM 3D printing, resulting in a completed PhD thesis on AM of ultra-performance polymers for space-application.
          - Characterized material performance under a full analytical suite (DSC, TGA, Rheology, TMA, DMA, FTIR, XRD, SEM, EDS, AFM, Micro CT), resulting in validated datasets underpinning 6 peer-reviewed publications.
          - Formed collaborations with Australian Nuclear Science and Technology Organisation and authored grant applications to facilitate radiation testing required to validate durability of FDM printed high-performance polymers in space environment.

